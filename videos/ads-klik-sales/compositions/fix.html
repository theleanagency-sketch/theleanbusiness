  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // red ground arrives with the whip from the chat
      tl.fromTo("#fx-red", { y: 1920 }, { y: 0, duration: 0.28, ease: "power3.out" }, 0);

      // "Jadi masalahnya bukan ads"
      tl.fromTo("#fx-small", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, 0.3);
      tl.fromTo("#fx-bukan", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 1.3);
      tl.fromTo("#fx-ads", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 1.86);
      tl.fromTo("#fx-strike", { scaleX: 0, rotation: -4 }, { scaleX: 1, rotation: -4, duration: 0.25, ease: "power3.out" }, 2.2);
      tl.to(["#fx-bukan", "#fx-ads", "#fx-strike"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 3.55);

      // "Masalahnya, apa yang jadi lepas orang click"
      tl.fromTo("#fx-small", { scale: 1 }, { keyframes: { scale: [1, 1.1, 1] }, duration: 0.35, ease: "power2.out" }, 2.6);
      tl.fromTo("#fx-lepas", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 4.66);
      tl.fromTo("#fx-klik", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 5.22);
      tl.fromTo("#fx-cur", { opacity: 0, x: 120, y: 120 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "expo.out" }, 5.3);
      tl.fromTo("#fx-klik", { y: 0 }, { keyframes: { y: [0, 14, 0] }, duration: 0.25, ease: "power2.out", immediateRender: false }, 5.6);

      // "Tampal setiap bocor" — yellow home stage, the funnel comes back with four holes
      tl.fromTo("#fx-yel", { clipPath: "circle(0px at 540px 960px)" }, { clipPath: "circle(1300px at 540px 960px)", duration: 0.45, ease: "power2.inOut" }, 5.9);
      tl.fromTo("#fx-title", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.32, ease: "expo.out" }, 6.12);
      tl.fromTo("#fx-svg", { opacity: 0, scale: 0.7, y: 120 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 6.1);
      tl.fromTo("#fx-tray", { opacity: 0, y: 60 }, { opacity: 0, y: 60, duration: 0.01 }, 0);

      // people falling into the mouth
      for (let k = 0; k < 24; k++) {
        const el = "#fx-d" + (k % 8);
        const t0 = 6.3 + k * 0.22;
        tl.fromTo(el, { y: -10, opacity: 0, scale: 1 }, { y: 20, opacity: 1, duration: 0.12, ease: "none", immediateRender: k < 8 }, t0);
        tl.fromTo(el, { y: 20, scale: 1 }, { y: 92, scale: 0.55, duration: 0.42, ease: "power2.in", immediateRender: false }, t0 + 0.12);
        tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none", immediateRender: false }, t0 + 0.48);
      }

      // leaks until each patch lands
      const patchAt = [7.86, 8.98, 10.02, 11.1];
      const dir = [
        [[-180, 330], [-250, 260], [-140, 400], [-290, 360], [-210, 300], [-160, 380]],
        [[180, 330], [250, 260], [140, 400], [270, 360], [210, 300], [160, 380]],
        [[-160, 260], [-230, 220], [-120, 300], [-260, 260], [-190, 200], [-140, 280]],
        [[150, 150], [220, 120], [120, 180], [240, 160], [180, 110], [130, 170]],
      ];
      for (let h = 0; h < 4; h++) {
        let k = 0;
        for (let t0 = 6.55 + h * 0.05; t0 < patchAt[h] - 0.05; t0 += 0.15) {
          const i = k % 6;
          const el = "#fx-s" + h + "-" + i;
          tl.fromTo(el, { x: 0, y: 0, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.06, ease: "none", immediateRender: k < 6 }, t0);
          tl.fromTo(el, { x: 0 }, { x: dir[h][i][0], duration: 0.8, ease: "power1.out", immediateRender: false }, t0);
          tl.fromTo(el, { y: 0 }, { y: dir[h][i][1], duration: 0.8, ease: "power2.in", immediateRender: false }, t0);
          tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, t0 + 0.68);
          k++;
        }
        const rot = [-20, 18, -12, 10][h];
        tl.fromTo("#fx-p" + h, { opacity: 0, scale: 1.8, rotation: rot - 25 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.3, ease: "back.out(2)" }, patchAt[h]);
      }

      // all patched: people now flow out of the spout into sales
      tl.to("#fx-tray", { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, 10.9);
      [8, 9, 10].forEach(function (n, j) {
        const t0 = 11.2 + j * 0.18;
        tl.fromTo("#fx-d" + n, { y: 0, opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, t0);
        tl.fromTo("#fx-d" + n, { y: 0 }, { y: 55, duration: 0.3, ease: "power2.in", immediateRender: false }, t0);
        tl.fromTo("#fx-d" + n, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none", immediateRender: false }, t0 + 0.28);
      });
      tl.fromTo("#fx-tray", { scale: 1 }, { keyframes: { scale: [1, 1.08, 1] }, duration: 0.3, ease: "power2.out", immediateRender: false }, 11.5);
      tl.set(["#fx-small", "#fx-lepas", "#fx-klik", "#fx-cur", "#fx-red"], { visibility: "hidden" }, 6.4);
      window.__timelines["fix"] = tl;
    })();
